name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: |
          KEY=$(node ace generate:key | head -n 1 | sed -e 's/\x1b\[[0-9;]*m//g')
          sed -i "s|^APP_KEY=.*|APP_KEY=$KEY|" .env

      - name: Run migrations
        run: node ace migration:run

      # Deploy step: preencher quando o ambiente/hospedagem for definido.
